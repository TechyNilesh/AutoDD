name: Sync Paper to Overleaf

on:
  push:
    branches:
      - main
    paths:
      - 'IJCAI-ECAI-26/**'
  workflow_dispatch:

jobs:
  sync-to-overleaf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync to paper branch and Overleaf
        env:
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        run: |
          # Checkout paper branch
          git checkout paper
          git pull origin paper

          # Copy files from main's IJCAI-ECAI-26 to paper branch root
          git checkout main -- IJCAI-ECAI-26/
          cp -r IJCAI-ECAI-26/* .
          rm -rf IJCAI-ECAI-26

          # Commit if there are changes
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync paper from main branch"
            git push origin paper

            # Push to Overleaf
            git remote add overleaf https://git:${OVERLEAF_TOKEN}@git.overleaf.com/6955b965ea1329764fed32c2 || true
            git push overleaf paper:master
          fi
